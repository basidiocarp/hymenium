[package]
name = "hymenium"
version = "0.9.2"
edition = "2024"
rust-version = "1.85"
authors = ["William Newton"]
description = "Workflow orchestration engine for multi-agent task execution"
license = "MIT"
repository = "https://github.com/basidiocarp/hymenium"
keywords = ["basidiocarp", "agents", "orchestration", "workflow", "cli"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
spore = { git = "https://github.com/basidiocarp/spore", rev = "85414a54afc16597297f6cd42edec5985474d767" }
thiserror = "2"
rusqlite = { version = "0.39", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time"] }
tracing = "0.1"
ulid = "1"
toml = "1"
which = "7"
libc = "0.2"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
lazy_static = "1.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Allow high-volume cosmetic pedantic lints for initial codebase;
# tighten as code is touched.
missing_errors_doc = "allow"
return_self_not_must_use = "allow"
format_push_string = "allow"
# Pre-existing pedantic violations to be addressed incrementally.
doc_markdown = "allow"
items_after_statements = "allow"
too_many_lines = "allow"
